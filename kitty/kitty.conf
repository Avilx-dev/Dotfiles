font_family      JetBrainsMono Nerd Font
 
cursor_shape  beam

background_opacity 0.85
dynamic_background_opacity yes

# --- Colores Base ---
foreground            #ffffff
background            #000000
selection_foreground  #000000
selection_background  #ff0000
url_color             #ff0000

# --- Bordes y Cursor ---
cursor                #ff0000
cursor_text_color     #000000
active_border_color   #ff0000
inactive_border_color #333333

# --- Paleta de la Terminal (ANSI) ---

# Black
color0 #000000
color8 #444444

# Red
color1 #ff5555
color9 #ff6e6e

# Green
color2  #50fa7b
color10 #69ff94

# Yellow
color3  #f1fa8c
color11 #ffffa5

# Blue (Lo usamos como Cian oscuro)
color4  #af0000
color12 #ff0000

# Magenta
color5  #bd93f9
color13 #ff79c6

# Cyan (Tu color principal)
color6  #ff0000
color14 #a4ffff

# White
color7  #bfbfbf
color15 #ffffff

symbol_map U+E900 icomoon
